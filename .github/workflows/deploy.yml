name: Deploy to Hostinger

# Memuat naik kod ke test.prostudio.my melalui FTP.
#
# Aplikasi ini TIDAK perlukan `npm install`: ia hanya menggunakan modul
# terbina dalam Node (node:sqlite, node:http). Jadi muat naik fail
# sumber sudah mencukupi - tiada native module untuk dibina.
#
# Yang TIDAK disentuh: data/ (pangkalan data SQLite yang sedang hidup).
# Fail itu tidak pernah dalam git, jadi ia tidak akan dihantar, dan
# `--delete` hanya dipakai dalam src/, public/ dan scripts/.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Pentadbir hanya. Repo ini peribadi dan mengandungi kod perniagaan.
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # lftp TIDAK termasuk dalam imej ubuntu-latest - tanpanya langkah
      # muat naik akan gagal dengan "lftp: command not found".
      - name: Install lftp
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp --version | head -1

      # build.json dicapa dengan commit ini, kemudian dimuat naik
      # bersama kod.inicap inilah yang membolehkan langkah pengesahan
      # memberitahu commit mana yang SEBENARNYA sedang berjalan.
      - name: Stamp the build
        run: |
          set -eu
          printf '{"sha":"%s"}\n' '${{ github.sha }}' > build.json
          cat build.json

      - name: Check required secrets are present
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -eu
          missing=''
          for v in DEPLOY_PATH FTP_HOST FTP_USER FTP_PASS FTP_PORT; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secret(s) tidak ditetapkan:$missing"
            exit 1
          fi
          echo "Semua rahsia tersedia. FTP_HOST=$FTP_HOST port=$FTP_PORT"

      - name: Upload source to ${{ secrets.DEPLOY_PATH }}
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -eu
          # Jangan cetak rahsia. Arahan lftp ditulis ke fail supaya kata
          # laluan tidak kelihatan dalam senarai proses.
          umask 077
          lftp_cmd="$(mktemp)"
          {
            echo "set cmd:fail-exit yes;"
            echo "set ssl:verify-certificate false;"
            echo "set ftp:ssl-allow no;"
            echo "set net:max-retries 3;"
            echo "set net:timeout 15;"
            # Port diberi sebagai argumen terakhir pada 'open'.
            # 'set ftp:port' TIDAK boleh digunakan - lftp menandakannya
            # sebagai "ambiguous variable name" dan berhenti.
            printf 'open -u "%s","%s" "%s" %s\n' "$FTP_USER" "$FTP_PASS" "$FTP_HOST" "${FTP_PORT:-21}"
            # Hanya direktori kod. data/ sengaja tidak disebut di sini.
            printf 'mirror --reverse --delete --verbose src/ "%s/src/"\n' "$DEPLOY_PATH"
            printf 'mirror --reverse --delete --verbose public/ "%s/public/"\n' "$DEPLOY_PATH"
            printf 'mirror --reverse --delete --verbose scripts/ "%s/scripts/"\n' "$DEPLOY_PATH"
            printf 'put server.js -o "%s/server.js"\n' "$DEPLOY_PATH"
            printf 'put package.json -o "%s/package.json"\n' "$DEPLOY_PATH"
            printf 'put build.json -o "%s/build.json"\n' "$DEPLOY_PATH"
            echo "bye;"
          } > "$lftp_cmd"

          lftp -f "$lftp_cmd"
          rm -f "$lftp_cmd"

      # Semak CAP BUILD yang sedang berjalan, bukan sekadar status HTTP.
      #
      # HTTP 200 tidak bermakna deploy sudah berkesan. Node membaca modul
      # sekali sahaja semasa permulaan, jadi selepas muat naik proses
      # masih memegang kod lama dan membalas 200 seperti biasa. Satu-
      # saturation cara membezakannya ialah membaca header X-App-Build.
      #
      # Jangkaan: selepas muat naik pertama, proses belum dimulakan
      # semula, jadi build lama akan dipaparkan. Itu KEGAGALAN dengan
      # mesej ralat yang jelas dan arahkan pentadbir ke hPanel - bukan
      # lolos secara senyap.
      - name: Verify the running build
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -u
          url="https://test.prostudio.my/login"
          hdr=$(curl -s -D - -o /dev/null --max-time 25 "$url" 2>/dev/null || true)
          code=$(printf '%s' "$hdr" | awk 'NR==1{print $2}')
          running=$(printf '%s' "$hdr" | tr -d '\r' \
            | awk 'tolower($1)=="x-app-build:"{print $2}')

          echo "URL:      $url"
          echo "HTTP:     ${code:-tiada jawapan}"
          echo "Dijangka: ${EXPECTED_SHA:0:7}"
          echo "Berjalan: ${running:-tiada header}"

          if [ "${code:-}" != "200" ]; then
            echo "::error::Halaman login tidak kembali 200 (dapat ${code:-tiada})."
            echo "::error::Aplikasi mungkin rosak atau tidak berjalan."
            exit 1
          fi

          case "$running" in
            "$EXPECTED_SHA" | "${EXPECTED_SHA:0:7}")
              echo "::notice::Commit ini yang sedang berjalan - deploy berkesan."
              ;;
            dev)
              echo "::error::Aplikasi melaporkan build 'dev'."
              echo "::error::build.json belum dibaca - periksa ia berada di root aplikasi."
              exit 1
              ;;
            "")
              echo "::error::Header X-App-Build tiada - ini kod lama yang belum"
              echo "::error::dimulakan semula, jadi ia belum tahu cara melapor diri."
              echo "::error::Mulakan semula aplikasi melalui hPanel (Advanced -> Node.js)."
              exit 1
              ;;
            *)
              echo "::error::Proses masih menjalankan build ${running:0:7}, bukan ${EXPECTED_SHA:0:7}."
              echo "::error::Fail sudah ada di pelayan, tetapi proses masih memegang"
              echo "::error::kod lama kerana Node hanya membaca modul semasa permulaan."
              echo "::error::Mulakan semula aplikasi melalui hPanel (Advanced -> Node.js)."
              exit 1
              ;;
          esac